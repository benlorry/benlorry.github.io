<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ben Lorry — Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f5f7;
      --card: #fff;
      --border: #e2e4e9;
      --text: #1a1a2e;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 20px 60px;
      line-height: 1.5;
    }

    .wrapper {
      max-width: 560px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 36px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .tools {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tool-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 22px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .tool-card:hover {
      border-color: #c4c8d0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .tool-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }

    .tool-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .arrow {
      font-size: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-left: 16px;
      transition: transform 0.15s;
    }

    .tool-card:hover .arrow {
      transform: translate(2px, -2px);
    }

    footer {
      margin-top: 36px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="eyebrow">Ben Lorry · Paid Media &amp; Growth</div>
      <h1>Tools &amp; Frameworks</h1>
    </header>

    <div class="tools">
      <a class="tool-card" href="/risk-reward-framework.html">
        <div>
          <div class="tool-title">Risk / Reward Framework</div>
          <div class="tool-desc">Upper funnel media ROI modeling for new channel pitches</div>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a class="tool-card" href="/launch-pod-staffing-planner.html">
        <div>
          <div class="tool-title">Launch Pod Staffing Planner</div>
          <div class="tool-desc">Scenario planner for staffing, fees, and P2R optimization</div>
        </div>
        <span class="arrow">↗</span>
      </a>
    </div>

    <footer>benlorry.github.io</footer>
  </div>
</body>
</html>
